[package]
name = "isa-audit"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Zero-dependency x86-64 ELF64 binary ISA feature auditor and CI verification gate"
license = "MIT"
repository = "https://github.com/alexander-src/isa-audit"
